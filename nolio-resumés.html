<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résumés Performance — Nolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap');
:root {
  --bg:#0e1117;--surface:#161b25;--surface2:#1e2535;--border:#2a3347;
  --accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--red:#ef4444;
  --orange:#f97316;--yellow:#eab308;--text:#e2e8f0;--muted:#64748b;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0f1724,#151e2e);border-bottom:1px solid var(--border);
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;}
.hdr-l{display:flex;align-items:center;gap:12px;}
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.hdr h1{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:#fff;}
.hdr p{font-size:11px;color:var(--muted);}

/* PERIOD SELECTOR */
.period-bar{display:flex;align-items:center;gap:8px;}
.period-tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;}
.ptab{padding:5px 12px;border-radius:6px;border:none;background:none;color:var(--muted);
  font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.ptab.active{background:var(--accent);color:#fff;}
.ptab:hover:not(.active){color:var(--text);}
.nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px;transition:all .2s;}
.nav-btn:hover{background:var(--border);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.period-lbl{font-size:12px;font-weight:600;color:var(--text);min-width:160px;text-align:center;}

/* MAIN */
.main{padding:20px 24px;max-width:1440px;margin:0 auto;}

/* AUTH */
.auth{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:20px;text-align:center;}
.auth h2{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#fff;}
.auth p{color:var(--muted);font-size:13px;max-width:400px;line-height:1.6;}
.config-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:24px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;}
.config-box h3{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#fff;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
.field input{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .2s;}
.field input:focus{border-color:var(--accent);}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;transition:opacity .2s;}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-sm:hover{background:var(--border);}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{color:var(--muted);font-size:13px;}

/* DASHBOARD */
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 14px;}
.stat .val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#fff;}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;}
.stat .sub{font-size:11px;margin-top:5px;}

/* TABS */
.dash-tabs{display:flex;gap:3px;margin-bottom:20px;background:var(--surface);
  border-radius:9px;padding:3px;width:fit-content;border:1px solid var(--border);}
.dtab{padding:7px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;
  color:var(--muted);border:none;background:none;font-family:'Inter',sans-serif;transition:all .2s;}
.dtab.active{background:var(--accent);color:#fff;}
.dtab:hover:not(.active){color:var(--text);background:var(--surface2);}

/* CONNECT BOX */
.connect-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;margin-bottom:20px;}
.connect-box h3{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#fff;margin-bottom:5px;}
.connect-box p{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5;}
.connect-link{display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;padding:9px 16px;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  text-decoration:none;transition:opacity .2s;}
.connect-link:hover{opacity:.85;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s,transform .15s;}
.card:hover{border-color:var(--accent);transform:translateY(-2px);}
.card-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.avatar{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0;}
.ath-info h3{font-size:14px;font-weight:600;color:#fff;}
.ath-info p{font-size:11px;color:var(--muted);margin-top:2px;}
.tbadge{margin-left:auto;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;display:flex;align-items:center;gap:3px;}
.t-up{background:rgba(34,197,94,.15);color:var(--green);}
.t-dn{background:rgba(239,68,68,.15);color:var(--red);}
.t-st{background:rgba(99,102,241,.15);color:#818cf8;}

.card-body{padding:14px 18px;display:flex;flex-direction:column;gap:12px;}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.met{background:var(--surface2);border-radius:9px;padding:11px 8px;text-align:center;border:1px solid var(--border);}
.met-v{font-size:18px;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif;}
.met-l{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;}

.bars{display:flex;flex-direction:column;gap:7px;}
.brow{display:flex;align-items:center;gap:7px;}
.blbl{font-size:10px;color:var(--muted);width:68px;flex-shrink:0;}
.btrack{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.bfill{height:100%;border-radius:3px;transition:width .6s ease;}
.bval{font-size:10px;font-weight:600;width:26px;text-align:right;}

.alerts{display:flex;flex-direction:column;gap:5px;}
.al{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border-radius:7px;font-size:11px;line-height:1.4;}
.al-warn{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.2);color:#fde047;}
.al-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5;}
.al-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15);color:#86efac;}
.al-icon{flex-shrink:0;font-size:12px;}

.ai-txt{font-size:11px;color:var(--muted);line-height:1.6;padding:10px;
  background:var(--surface2);border-radius:7px;border-left:3px solid var(--accent);}

/* CHART SECTION */
.chart-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;margin-bottom:16px;}
.chart-section h3{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:#fff;margin-bottom:14px;}
.chart-wrap{position:relative;height:200px;}

/* PERIOD SUMMARY */
.period-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;margin-bottom:20px;}
.period-summary h3{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#fff;margin-bottom:14px;}
.weeks-list{display:flex;flex-direction:column;gap:8px;}
.week-row{display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:border-color .2s;}
.week-row:hover{border-color:var(--accent);}
.week-row .wlbl{font-size:12px;font-weight:500;color:var(--text);width:140px;flex-shrink:0;}
.week-row .wkm{font-size:12px;color:var(--muted);}
.week-row .wtrend{margin-left:auto;font-size:11px;font-weight:600;}

/* ERROR */
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--r);
  padding:16px;color:#fca5a5;font-size:13px;margin-bottom:16px;}

/* NO DATA */
.nodata{display:flex;flex-direction:column;align-items:center;gap:10px;padding:50px 20px;text-align:center;}
.nodata h3{font-size:15px;font-weight:600;color:#fff;}
.nodata p{font-size:12px;color:var(--muted);max-width:340px;line-height:1.6;}

@media(max-width:600px){
  .main{padding:12px;}
  .hdr{padding:12px 14px;}
  .grid{grid-template-columns:1fr;}
  .overview{grid-template-columns:repeat(2,1fr);}
  .period-bar{flex-wrap:wrap;gap:6px;}
}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-l">
    <div class="logo">🏃</div>
    <div><h1>Résumés Performance</h1><p>Suivi Nolio — Coach</p></div>
  </div>
  <div class="period-bar" id="periodBar" style="display:none">
    <div class="period-tabs">
      <button class="ptab active" onclick="setPeriod('week')">Semaine</button>
      <button class="ptab" onclick="setPeriod('month')">Mois</button>
      <button class="ptab" onclick="setPeriod('quarter')">3 Mois</button>
    </div>
    <button class="nav-btn" onclick="navigate(-1)">‹</button>
    <span class="period-lbl" id="periodLbl">—</span>
    <button class="nav-btn" onclick="navigate(1)" id="nextBtn">›</button>
  </div>
</div>

<div class="main" id="app">
  <!-- AUTH -->
  <div class="auth" id="authScreen">
    <div style="font-size:48px">🔐</div>
    <h2>Connexion à Nolio</h2>
    <p>Entre tes identifiants API Production pour accéder aux données de tes coureurs.</p>
    <div class="config-box">
      <h3>⚙️ Configuration API Production</h3>
      <div class="field">
        <label>Client ID</label>
        <input id="fClientId" type="text" placeholder="LDiR5WZ4op..."/>
      </div>
      <div class="field">
        <label>Client Secret</label>
        <input id="fClientSecret" type="password" placeholder="Uvvoh9La99..."/>
      </div>
      <div class="field">
        <label>URL Callback (nolio.io/api → Edit)</label>
        <input id="fCallback" type="text" placeholder="https://..."/>
      </div>
      <div id="cfgErr" style="color:#fca5a5;font-size:11px;display:none"></div>
      <button class="btn" onclick="saveConfig()">Connecter →</button>
    </div>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loadScreen" style="display:none">
    <div class="spin"></div>
    <p id="loadMsg">Chargement...</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" style="display:none">
    <div id="errBox" class="err" style="display:none"></div>
    <div class="overview" id="overview"></div>
    <div class="dash-tabs">
      <button class="dtab active" onclick="setTab('all')" id="tabAll">Tous les coureurs</button>
      <button class="dtab" onclick="setTab('alerts')" id="tabAlerts">⚠️ Vigilance <span id="alertCnt"></span></button>
      <button class="dtab" onclick="setTab('trends')" id="tabTrends">📈 Évolution</button>
    </div>
    <div id="connectBox"></div>
    <div id="trendsSection" style="display:none"></div>
    <div class="grid" id="athleteGrid"></div>
    <div class="nodata" id="noData" style="display:none">
      <div style="font-size:36px">📭</div>
      <h3>Aucune donnée</h3>
      <p>Aucune séance enregistrée sur cette période.</p>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────
let cfg = {clientId:'',clientSecret:'',callbackUrl:''};
let tokens = {};       // athleteId -> {access_token,refresh_token,expires_at}
let athletes = [];     // [{nolio_id, name}]
let summaries = {};    // athleteId -> summary
let period = 'week';   // 'week'|'month'|'quarter'
let offset = 0;        // periods back from now
let activeTab = 'all';
let charts = {};

// ── INIT ───────────────────────────────────────────────────────
window.onload = async () => {
  loadStorage();
  const p = new URLSearchParams(window.location.search);
  const code = p.get('code'), state = p.get('state');
  if (code && state && cfg.clientId) {
    await handleCallback(code, state);
    history.replaceState({}, '', location.pathname);
  }
  if (cfg.clientId && cfg.clientSecret) startDash();
};

function loadStorage() {
  try { const c = localStorage.getItem('nlio_cfg'); if(c) cfg = JSON.parse(c); } catch(e){}
  try { const t = localStorage.getItem('nlio_tok'); if(t) tokens = JSON.parse(t); } catch(e){}
}
function saveStorage() {
  localStorage.setItem('nlio_cfg', JSON.stringify(cfg));
  localStorage.setItem('nlio_tok', JSON.stringify(tokens));
}

// ── CONFIG ─────────────────────────────────────────────────────
function saveConfig() {
  const cid = document.getElementById('fClientId').value.trim();
  const cs  = document.getElementById('fClientSecret').value.trim();
  const cb  = document.getElementById('fCallback').value.trim() || location.href.split('?')[0];
  if (!cid || !cs) { showCfgErr('Merci de renseigner Client ID et Client Secret.'); return; }
  cfg = {clientId:cid, clientSecret:cs, callbackUrl:cb};
  saveStorage();
  startDash();
}
function showCfgErr(m) {
  const el = document.getElementById('cfgErr');
  el.textContent = m; el.style.display = 'block';
}

// ── OAUTH ──────────────────────────────────────────────────────
function authUrl() {
  const state = btoa(JSON.stringify({ts:Date.now()}));
  return `https://www.nolio.io/api/authorize/?response_type=code&client_id=${encodeURIComponent(cfg.clientId)}&redirect_uri=${encodeURIComponent(cfg.callbackUrl)}&state=${encodeURIComponent(state)}`;
}
async function handleCallback(code, state) {
  setLoad('Connexion du coureur...');
  try {
    const creds = btoa(`${cfg.clientId}:${cfg.clientSecret}`);
    const body = new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:cfg.callbackUrl});
    const r = await fetch('https://www.nolio.io/api/token/', {
      method:'POST',
      headers:{'Authorization':`Basic ${creds}`,'Content-Type':'application/x-www-form-urlencoded'},
      body: body.toString()
    });
    if (!r.ok) throw new Error('Token exchange failed');
    const d = await r.json();
    const profile = await apiGet('https://www.nolio.io/api/get/profile/', d.access_token);
    const aid = String(profile.nolio_id || profile.id || Date.now());
    tokens[aid] = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in||86400)*1000};
    saveStorage();
  } catch(e) { console.error('OAuth error:', e); }
}
async function refreshTok(aid) {
  const t = tokens[aid]; if(!t) return null;
  const creds = btoa(`${cfg.clientId}:${cfg.clientSecret}`);
  const body = new URLSearchParams({grant_type:'refresh_token',refresh_token:t.refresh_token});
  const r = await fetch('https://www.nolio.io/api/token/', {
    method:'POST',
    headers:{'Authorization':`Basic ${creds}`,'Content-Type':'application/x-www-form-urlencoded'},
    body: body.toString()
  });
  if (!r.ok) { delete tokens[aid]; saveStorage(); return null; }
  const d = await r.json();
  tokens[aid] = {access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||86400)*1000};
  saveStorage();
  return d.access_token;
}
async function getTok(aid) {
  const t = tokens[aid]; if(!t) return null;
  if (Date.now() < t.expires_at - 60000) return t.access_token;
  return await refreshTok(aid);
}

// ── API ────────────────────────────────────────────────────────
async function apiGet(url, tok) {
  const r = await fetch(url, {headers:{'Authorization':`Bearer ${tok}`,'Accept':'application/json'}});
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

// ── DATE HELPERS ───────────────────────────────────────────────
function getPeriodRange(p, off) {
  const now = new Date();
  let from, to;
  if (p === 'week') {
    const day = now.getDay(), diff = day===0?6:day-1;
    const mon = new Date(now); mon.setDate(now.getDate()-diff+off*7); mon.setHours(0,0,0,0);
    const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
    from = mon; to = sun;
  } else if (p === 'month') {
    const d = new Date(now.getFullYear(), now.getMonth()+off, 1);
    from = new Date(d.getFullYear(), d.getMonth(), 1);
    to   = new Date(d.getFullYear(), d.getMonth()+1, 0, 23, 59, 59);
  } else { // quarter
    const qStart = Math.floor(now.getMonth()/3)*3 + off*3;
    const yr = now.getFullYear() + Math.floor(qStart/12);
    const mo = ((qStart%12)+12)%12;
    from = new Date(yr, mo, 1);
    to   = new Date(yr, mo+3, 0, 23, 59, 59);
  }
  return {from, to};
}
function fmtDate(d) { return d.toISOString().split('T')[0]; }
function fmtLabel(p, off) {
  const {from, to} = getPeriodRange(p, off);
  const fr = (d, long=false) => d.toLocaleDateString('fr-FR',long?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short'});
  if (p==='week') return `${fr(from)} – ${fr(to)}`;
  if (p==='month') return from.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return `${fr(from,true)} – ${fr(to,true)}`;
}

// Previous period for trend comparison
function getPrevRange(p, off) { return getPeriodRange(p, off-1); }

// Weeks inside a period (for monthly/quarterly breakdown)
function getWeeksInPeriod(from, to) {
  const weeks = [];
  let cur = new Date(from);
  // align to Monday
  const d = cur.getDay(); cur.setDate(cur.getDate() - (d===0?6:d-1));
  while (cur <= to) {
    const wEnd = new Date(cur); wEnd.setDate(cur.getDate()+6);
    weeks.push({from: new Date(Math.max(cur,from)), to: new Date(Math.min(wEnd,to))});
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}

// ── DASHBOARD ──────────────────────────────────────────────────
function startDash() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('periodBar').style.display = 'flex';
  setLoad('Chargement des coureurs...');
  updatePeriodLabel();
  loadAll();
}
function setLoad(msg) {
  document.getElementById('loadScreen').style.display = 'flex';
  document.getElementById('dash').style.display = 'none';
  document.getElementById('loadMsg').textContent = msg;
}
function updatePeriodLabel() {
  document.getElementById('periodLbl').textContent = fmtLabel(period, offset);
  document.getElementById('nextBtn').disabled = offset >= 0;
}
function setPeriod(p) {
  period = p; offset = 0;
  document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  updatePeriodLabel();
  setLoad('Chargement...'); loadAll();
}
function navigate(dir) {
  offset += dir; if(offset>0) offset=0;
  updatePeriodLabel();
  setLoad('Chargement...'); loadAll();
}
function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.dtab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
  document.getElementById('trendsSection').style.display = t==='trends'?'block':'none';
  document.getElementById('athleteGrid').style.display = t==='trends'?'none':'grid';
  if (t==='trends') renderTrends(); else renderAthletes();
}

// ── LOAD DATA ──────────────────────────────────────────────────
async function loadAll() {
  try {
    const connIds = Object.keys(tokens);
    athletes = []; summaries = {};

    // Fetch athlete list from first coach token
    if (connIds.length > 0) {
      const tok = await getTok(connIds[0]);
      if (tok) {
        try {
          const list = await apiGet('https://www.nolio.io/api/get/athletes/?wants_coach=false', tok);
          athletes = Array.isArray(list) ? list : [];
        } catch(e) {
          for (const id of connIds) {
            try {
              const t2 = await getTok(id);
              if (!t2) continue;
              const prof = await apiGet('https://www.nolio.io/api/get/profile/', t2);
              athletes.push({nolio_id:id, name: prof.name||`Coureur ${id}`});
            } catch(e2){}
          }
        }
      }
    }

    const {from, to} = getPeriodRange(period, offset);
    const {from:pFrom, to:pTo} = getPrevRange(period, offset);

    await Promise.all(connIds.map(async aid => {
      try {
        const tok = await getTok(aid);
        if (!tok) return;
        // Use higher limit for longer periods
        const lim = period==='quarter' ? 200 : period==='month' ? 100 : 30;
        const [cur, prev] = await Promise.all([
          apiGet(`https://www.nolio.io/api/get/training/?from=${fmtDate(from)}&to=${fmtDate(to)}&limit=${lim}`, tok).catch(()=>[]),
          apiGet(`https://www.nolio.io/api/get/training/?from=${fmtDate(pFrom)}&to=${fmtDate(pTo)}&limit=${lim}`, tok).catch(()=>[])
        ]);

        // For monthly/quarterly, also get weekly breakdown
        let weeklyData = [];
        if (period !== 'week') {
          const weeks = getWeeksInPeriod(from, to);
          weeklyData = weeks.map(w => {
            const ww = (Array.isArray(cur)?cur:[]).filter(t => {
              const d = new Date(t.date_start);
              return d >= w.from && d <= w.to;
            });
            return { from: w.from, to: w.to, workouts: ww };
          });
        }

        summaries[aid] = buildSummary(aid, cur||[], prev||[], weeklyData);
      } catch(e) { console.error(aid, e); }
    }));

    await genAISummaries();
    renderDash();
  } catch(e) {
    showErr('Erreur : ' + e.message);
    document.getElementById('loadScreen').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
  }
}

// ── BUILD SUMMARY ──────────────────────────────────────────────
function buildSummary(aid, workouts, prevWorkouts, weeklyData) {
  const w = Array.isArray(workouts) ? workouts : [];
  const pw = Array.isArray(prevWorkouts) ? prevWorkouts : [];

  const sum = arr => ({
    dist: arr.reduce((s,x)=>s+(x.distance||0),0),
    dur:  arr.reduce((s,x)=>s+(x.duration||0),0)/3600,
    elev: arr.reduce((s,x)=>s+(x.total_elevation_gain||0),0),
    load: arr.reduce((s,x)=>s+(x.load_foster||0),0),
    rpes: arr.filter(x=>x.rpe).map(x=>x.rpe),
    feel: arr.filter(x=>x.feeling).map(x=>x.feeling),
    n:    arr.length
  });

  const cur = sum(w), prev = sum(pw);
  const avgRpe    = cur.rpes.length ? cur.rpes.reduce((a,b)=>a+b)/cur.rpes.length : null;
  const avgFeel   = cur.feel.length ? cur.feel.reduce((a,b)=>a+b)/cur.feel.length : null;
  const volTrend  = prev.dist > 0 ? (cur.dist-prev.dist)/prev.dist*100 : 0;
  const loadTrend = prev.load > 0 ? (cur.load-prev.load)/prev.load*100 : 0;

  // Pace trend (lower = faster = better)
  const pace    = cur.dist>0&&cur.dur>0  ? cur.dur/cur.dist*60  : null; // min/km
  const pPace   = prev.dist>0&&prev.dur>0? prev.dur/prev.dist*60: null;
  const perfTrend = pace&&pPace ? pPace-pace : 0; // positive = faster

  // Alerts
  const alerts = [];
  if (cur.n === 0) alerts.push({type:'warn', msg:'Aucune séance enregistrée sur cette période'});
  const loadRatio = prev.load > 0 ? cur.load/prev.load : 1;
  if (loadRatio > 1.35) alerts.push({type:'danger', msg:`Charge +${Math.round((loadRatio-1)*100)}% vs période précédente — risque de surcharge`});
  else if (loadRatio > 1.2) alerts.push({type:'warn', msg:`Charge +${Math.round((loadRatio-1)*100)}% — surveiller la récupération`});
  if (avgRpe !== null && avgRpe > 8) alerts.push({type:'warn', msg:`RPE moyen élevé (${avgRpe.toFixed(1)}/10)`});
  if (avgFeel !== null && avgFeel < 3) alerts.push({type:'danger', msg:`Sensations basses (${avgFeel.toFixed(1)}/5)`});
  if (perfTrend > 0.5) alerts.push({type:'ok', msg:`Allure en amélioration de ${Math.abs(perfTrend).toFixed(1)} sec/km`});
  if (perfTrend < -1) alerts.push({type:'warn', msg:`Régression d'allure de ${Math.abs(perfTrend).toFixed(1)} sec/km`});

  return {
    aid, n:cur.n,
    dist: Math.round(cur.dist*10)/10,
    dur:  Math.round(cur.dur*10)/10,
    load: Math.round(cur.load),
    avgRpe, avgFeel,
    volTrend, loadTrend, perfTrend,
    alerts, workouts:w, weeklyData,
    prevDist: Math.round(prev.dist*10)/10,
    prevLoad: Math.round(prev.load),
    aiSummary: null
  };
}

// ── AI SUMMARIES ───────────────────────────────────────────────
async function genAISummaries() {
  const ids = Object.keys(summaries);
  if (!ids.length) return;
  const lbl = fmtLabel(period, offset);
  const pLabel = {week:'semaine',month:'mois',quarter:'trimestre'}[period];

  await Promise.all(ids.map(async aid => {
    const s = summaries[aid];
    const ath = athletes.find(a=>String(a.nolio_id)===String(aid));
    const name = ath ? ath.name : `Coureur ${aid}`;
    try {
      const prompt = `Tu es analyste performance pour un entraîneur de running de haut niveau.
Données du ${pLabel} (${lbl}) pour ${name} :
- Séances : ${s.n}
- Distance : ${s.dist} km (vs ${s.prevDist} km période précédente)
- Charge Foster : ${s.load} (vs ${s.prevLoad})
- Tendance volume : ${s.volTrend>0?'+':''}${Math.round(s.volTrend)}%
- RPE moyen : ${s.avgRpe!==null?s.avgRpe.toFixed(1)+'/10':'non renseigné'}
- Sensation moyenne : ${s.avgFeel!==null?s.avgFeel.toFixed(1)+'/5':'non renseignée'}
- Tendance allure : ${s.perfTrend>0?'amélioration':'régression ou stable'} (${Math.abs(s.perfTrend).toFixed(1)} sec/km)
Points de vigilance : ${s.alerts.filter(a=>a.type!=='ok').map(a=>a.msg).join('; ')||'aucun'}

Résumé en 3-4 phrases max, en français, pour l'entraîneur. Direct, factuel, orienté performance et récupération.`;
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
      });
      if (r.ok) {
        const d = await r.json();
        summaries[aid].aiSummary = d.content?.find(b=>b.type==='text')?.text || '';
      }
    } catch(e){}
  }));
}

// ── RENDER DASHBOARD ───────────────────────────────────────────
function renderDash() {
  document.getElementById('loadScreen').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  renderOverview();
  renderConnectBox();
  if (activeTab === 'trends') renderTrends();
  else renderAthletes();
}

function renderOverview() {
  const ids = Object.keys(summaries);
  const totalAlerts = ids.reduce((s,id)=>s+summaries[id].alerts.filter(a=>a.type!=='ok').length,0);
  const totalKm = ids.reduce((s,id)=>s+summaries[id].dist,0);
  const totalLoad = ids.reduce((s,id)=>s+summaries[id].load,0);
  const pLabel = {week:'semaine','month':'mois','quarter':'trimestre'}[period];
  document.getElementById('alertCnt').textContent = totalAlerts>0?`(${totalAlerts})`:'';
  document.getElementById('overview').innerHTML = `
    <div class="stat"><div class="val">${ids.length}</div><div class="lbl">Coureurs connectés</div><div class="sub" style="color:var(--muted)">${athletes.length} au total</div></div>
    <div class="stat"><div class="val" style="color:${totalAlerts>0?'var(--orange)':'var(--green)'}">${totalAlerts}</div><div class="lbl">Points de vigilance</div><div class="sub" style="color:var(--muted)">ce ${pLabel}</div></div>
    <div class="stat"><div class="val">${totalKm.toFixed(0)}</div><div class="lbl">km équipe</div><div class="sub" style="color:var(--muted)">ce ${pLabel}</div></div>
    <div class="stat"><div class="val">${Math.round(totalLoad/Math.max(ids.length,1))}</div><div class="lbl">Charge moy.</div><div class="sub" style="color:var(--muted)">Foster / coureur</div></div>
  `;
}

function renderConnectBox() {
  const connIds = Object.keys(tokens);
  if (connIds.length === 0) {
    document.getElementById('connectBox').innerHTML = `
      <div class="connect-box">
        <h3>🔗 Connecter les coureurs</h3>
        <p>Chaque coureur doit autoriser l'accès une seule fois depuis son compte Nolio.</p>
        <a class="connect-link" href="${authUrl()}" target="_blank">+ Connecter un coureur</a>
      </div>`;
  } else {
    const unconn = athletes.filter(a=>!connIds.includes(String(a.nolio_id)));
    document.getElementById('connectBox').innerHTML = unconn.length > 0 ? `
      <div class="connect-box">
        <h3>🔗 ${unconn.length} coureur(s) non connecté(s)</h3>
        <p>Envoie ce lien aux coureurs non connectés pour qu'ils autorisent l'accès :</p>
        <a class="connect-link" href="${authUrl()}" target="_blank">+ Autoriser un coureur</a>
      </div>` : '';
  }
}

function renderAthletes() {
  const grid = document.getElementById('athleteGrid');
  let ids = Object.keys(summaries);
  if (activeTab === 'alerts') ids = ids.filter(id=>summaries[id].alerts.some(a=>a.type!=='ok'));
  // Sort dangers first
  ids.sort((a,b)=>{
    const da = summaries[a].alerts.filter(x=>x.type==='danger').length;
    const db = summaries[b].alerts.filter(x=>x.type==='danger').length;
    return db-da;
  });
  document.getElementById('noData').style.display = ids.length===0 && Object.keys(summaries).length>0 ? 'flex':'none';
  grid.innerHTML = ids.map(aid => cardHTML(aid)).join('');

  // Weekly breakdown for month/quarter
  if (period !== 'week') {
    ids.forEach(aid => {
      const s = summaries[aid];
      if (s.weeklyData && s.weeklyData.length) renderWeekChart(aid, s.weeklyData);
    });
  }
}

function cardHTML(aid) {
  const s = summaries[aid];
  const ath = athletes.find(a=>String(a.nolio_id)===String(aid));
  const name = ath ? ath.name : `Coureur ${aid}`;
  const ini = name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
  const tc = s.perfTrend>0.3?'t-up':s.perfTrend<-0.3?'t-dn':'t-st';
  const ti = s.perfTrend>0.3?'↑':s.perfTrend<-0.3?'↓':'→';
  const tl = s.perfTrend>0.3?'Progression':s.perfTrend<-0.3?'Régression':'Stable';
  const rpeC = s.avgRpe===null?'#64748b':s.avgRpe>8?'var(--red)':s.avgRpe>6?'var(--orange)':'var(--green)';
  const feelC = s.avgFeel===null?'#64748b':s.avgFeel<3?'var(--red)':s.avgFeel<4?'var(--orange)':'var(--green)';
  const volC = Math.abs(s.volTrend)>30?'var(--orange)':'var(--muted)';
  const pLabel = {week:'S-1',month:'M-1',quarter:'T-1'}[period];
  const volStr = (s.volTrend>0?'+':'')+Math.round(s.volTrend)+'%';

  const alertsHtml = s.alerts.map(a=>`
    <div class="al al-${a.type}">
      <span class="al-icon">${a.type==='danger'?'🔴':a.type==='warn'?'⚠️':'✅'}</span>
      <span>${a.msg}</span>
    </div>`).join('');

  const weekChart = period!=='week' ? `<div><canvas id="wc_${aid}" height="70"></canvas></div>` : '';

  return `
  <div class="card">
    <div class="card-hdr">
      <div class="avatar">${ini}</div>
      <div class="ath-info">
        <h3>${name}</h3>
        <p>${s.n} séance${s.n>1?'s':''} · ${s.dist} km · <span style="color:${volC}">${volStr} vs ${pLabel}</span></p>
      </div>
      <div class="tbadge ${tc}">${ti} ${tl}</div>
    </div>
    <div class="card-body">
      <div class="mrow">
        <div class="met"><div class="met-v">${s.dist}</div><div class="met-l">km</div></div>
        <div class="met"><div class="met-v">${s.dur}</div><div class="met-l">heures</div></div>
        <div class="met"><div class="met-v">${s.load}</div><div class="met-l">charge</div></div>
      </div>
      <div class="bars">
        <div class="brow">
          <span class="blbl">RPE moyen</span>
          <div class="btrack"><div class="bfill" style="width:${s.avgRpe?s.avgRpe*10:0}%;background:${rpeC}"></div></div>
          <span class="bval" style="color:${rpeC}">${s.avgRpe!==null?s.avgRpe.toFixed(1):'—'}</span>
        </div>
        <div class="brow">
          <span class="blbl">Sensation</span>
          <div class="btrack"><div class="bfill" style="width:${s.avgFeel?s.avgFeel*20:0}%;background:${feelC}"></div></div>
          <span class="bval" style="color:${feelC}">${s.avgFeel!==null?s.avgFeel.toFixed(1)+'/5':'—'}</span>
        </div>
      </div>
      ${weekChart}
      ${alertsHtml?`<div class="alerts">${alertsHtml}</div>`:''}
      ${s.aiSummary?`<div class="ai-txt">${s.aiSummary}</div>`:''}
    </div>
  </div>`;
}

function renderWeekChart(aid, weeklyData) {
  const ctx = document.getElementById(`wc_${aid}`);
  if (!ctx) return;
  if (charts[aid]) { charts[aid].destroy(); }
  const labels = weeklyData.map(w => {
    const d = w.from;
    return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  });
  const data = weeklyData.map(w => w.workouts.reduce((s,x)=>s+(x.distance||0),0));
  charts[aid] = new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[{
        data,
        backgroundColor:'rgba(59,130,246,0.5)',
        borderColor:'rgba(59,130,246,0.8)',
        borderWidth:1,
        borderRadius:4
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw.toFixed(1)} km`}}},
      scales:{
        x:{ticks:{color:'#64748b',font:{size:9}},grid:{display:false}},
        y:{ticks:{color:'#64748b',font:{size:9},callback:v=>`${v}km`},grid:{color:'rgba(42,51,71,.4)'}}
      }
    }
  });
}

function renderTrends() {
  const ids = Object.keys(summaries);
  if (!ids.length) { document.getElementById('trendsSection').innerHTML = '<div class="nodata"><div style="font-size:36px">📊</div><h3>Aucune donnée</h3><p>Connecte des coureurs pour voir les tendances.</p></div>'; return; }

  const labels = ids.map(aid => {
    const a = athletes.find(x=>String(x.nolio_id)===String(aid));
    return a ? a.name.split(' ')[0] : `#${aid}`;
  });
  const distData  = ids.map(id=>summaries[id].dist);
  const loadData  = ids.map(id=>summaries[id].load);
  const trendData = ids.map(id=>summaries[id].volTrend);

  document.getElementById('trendsSection').innerHTML = `
    <div class="chart-section">
      <h3>📏 Distance par coureur (km)</h3>
      <div class="chart-wrap"><canvas id="chartDist"></canvas></div>
    </div>
    <div class="chart-section">
      <h3>⚡ Charge Foster par coureur</h3>
      <div class="chart-wrap"><canvas id="chartLoad"></canvas></div>
    </div>
    <div class="chart-section">
      <h3>📈 Tendance volume vs période précédente (%)</h3>
      <div class="chart-wrap"><canvas id="chartTrend"></canvas></div>
    </div>
  `;

  const barOpts = (color) => ({
    type:'bar',
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}},
        y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(42,51,71,.5)'}}
      }
    },
    data:{labels, datasets:[{data:distData,backgroundColor:color,borderRadius:5}]}
  });

  new Chart(document.getElementById('chartDist'), {
    type:'bar',data:{labels,datasets:[{data:distData,backgroundColor:'rgba(59,130,246,.6)',borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#94a3b8',font:{size:10},callback:v=>v+'km'},grid:{color:'rgba(42,51,71,.5)'}}}}
  });
  new Chart(document.getElementById('chartLoad'), {
    type:'bar',data:{labels,datasets:[{data:loadData,backgroundColor:'rgba(99,102,241,.6)',borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(42,51,71,.5)'}}}}
  });
  new Chart(document.getElementById('chartTrend'), {
    type:'bar',
    data:{labels,datasets:[{
      data:trendData,
      backgroundColor:trendData.map(v=>v>0?'rgba(34,197,94,.6)':'rgba(239,68,68,.6)'),
      borderRadius:5
    }]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}},
        y:{ticks:{color:'#94a3b8',font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(42,51,71,.5)'},border:{dash:[4,4]}}}}
  });
}

function showErr(m) {
  const el = document.getElementById('errBox');
  el.textContent = m; el.style.display = 'block';
}
</script>
